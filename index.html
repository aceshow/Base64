<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Base64 编码解码</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Cormorant+Garamond:wght@600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#0a0a0b; --surface:#131211; --ink:#f1e8d4; --muted:#9a8f77;
  --line:#2c2820; --gold:#d4af37; --gold-ink:#1a1405;
  --out:#e6c569; --out-bg:#15120a; --in-bg:#0d0c0b; --err:#ff8a7a;
  --ease:cubic-bezier(.2,.7,.2,1);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;min-height:100vh;color:var(--ink);
  background:radial-gradient(ellipse 80% 50% at 50% -5%,rgba(212,175,55,.16),transparent 70%) var(--bg);
  font-family:"DM Sans","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  display:flex;justify-content:center;padding:clamp(14px,5vw,56px) clamp(12px,4vw,24px);
}
main{width:100%;max-width:820px}
header{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:clamp(16px,3vw,26px)}
h1{
  margin:0 0 8px;font-family:"Cormorant Garamond","Songti SC","Source Han Serif SC","Noto Serif CJK SC",serif;
  font-size:clamp(28px,6vw,44px);font-weight:700;letter-spacing:.03em;line-height:1.15;
  background:linear-gradient(135deg,#f6e3a1,#d4af37 50%,#a9821f);-webkit-background-clip:text;background-clip:text;color:transparent;
}
.sub{margin:0;color:var(--muted);font-size:clamp(13px,2.4vw,15px);max-width:46ch;line-height:1.55}

/* language switch */
.lang{position:relative;display:inline-grid;grid-template-columns:1fr 1fr;border:1px solid rgba(212,175,55,.3);border-radius:999px;padding:3px;background:var(--surface)}
.lang::before{content:"";position:absolute;top:3px;bottom:3px;left:3px;width:calc(50% - 3px);border-radius:999px;
  background:linear-gradient(135deg,#f0d78a,#d4af37 50%,#a9821f);transition:transform .35s var(--ease)}
.lang[data-active="en"]::before{transform:translateX(100%)}
.lang button{position:relative;z-index:1;border:0;background:none;padding:6px 16px;font-size:13px;font-weight:700;color:var(--muted);border-radius:999px;transition:color .25s}
.lang button[aria-pressed="true"]{color:var(--gold-ink)}

.panel{
  background:var(--surface);border:1px solid rgba(212,175,55,.3);border-radius:18px;
  box-shadow:0 30px 80px -30px rgba(0,0,0,.95);padding:clamp(14px,3.5vw,24px);
  animation:rise .6s var(--ease) both;
}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

.field-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:12px}
label,.label{font-weight:700;font-size:15px}
.count{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}
textarea{
  display:block;width:100%;min-height:clamp(120px,22vh,240px);resize:vertical;border-radius:14px;
  border:1.5px solid var(--line);padding:14px 16px;color:var(--ink);outline:none;word-break:break-all;
  font:400 14px/1.6 "JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  transition:border-color .2s,box-shadow .25s,background .2s;
}
#input{background:var(--in-bg)}
#output{background:var(--out-bg);border-color:color-mix(in srgb,var(--out) 30%,var(--line))}
textarea:hover{border-color:color-mix(in srgb,var(--gold) 45%,var(--line))}
textarea:focus{border-color:var(--gold);box-shadow:0 0 0 4px rgba(212,175,55,.16)}

.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:clamp(14px,2.5vw,20px) 0}
.spacer{flex:1}
button{
  font:inherit;font-weight:700;font-size:15px;cursor:pointer;border-radius:12px;
  padding:11px 22px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);
  transition:transform .15s var(--ease),border-color .2s,color .2s,background .2s,box-shadow .25s;
}
button:hover{border-color:var(--gold)}
button:active{transform:scale(.97)}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.primary{position:relative;overflow:hidden;background:linear-gradient(135deg,#f0d78a,#d4af37 45%,#a9821f);border-color:#d4af37;color:var(--gold-ink)}
.primary::after{content:"";position:absolute;top:0;bottom:0;left:-60%;width:40%;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);transform:skewX(-20deg);transition:left .6s var(--ease)}
.primary:hover{box-shadow:0 8px 24px -8px rgba(212,175,55,.6)}
.primary:hover::after{left:130%}
.ghost{font-weight:500;color:var(--muted);padding:11px 14px;border-color:transparent;background:transparent}
.ghost:hover{color:var(--ink);border-color:var(--line)}

.opt{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted);cursor:pointer;user-select:none;font-weight:400}
.opt input{position:absolute;opacity:0;pointer-events:none}
.switch{width:38px;height:22px;border-radius:99px;background:var(--line);position:relative;flex:none;transition:background .25s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#f1e8d4;transition:transform .3s var(--ease),background .25s}
.opt input:checked+.switch{background:var(--gold)}
.opt input:checked+.switch::after{transform:translateX(16px);background:var(--gold-ink)}
.opt input:focus-visible+.switch{outline:3px solid var(--gold);outline-offset:2px}

.copy{padding:6px 14px;font-size:13px;border-radius:9px}
.copy.done{background:var(--gold);border-color:var(--gold);color:var(--gold-ink)}
.status{min-height:22px;margin:12px 2px 0;font-size:14px;color:var(--muted)}
.status.err{color:var(--err)}
.status.ok{color:var(--out)}

footer{margin-top:clamp(18px,4vw,32px);text-align:center;font-size:13px;color:var(--muted);letter-spacing:.02em;animation:rise .6s var(--ease) .15s both}
footer::before{content:"";display:block;width:48px;height:1px;margin:0 auto 14px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
@media (max-width:560px){
  .bar{display:grid;grid-template-columns:1fr 1fr}
  .spacer{display:none}
  .opt{grid-column:1/-1;order:5}
  button{padding:12px 10px}
}
@media (max-width:340px){.field-head .count{display:none}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main>
  <header>
    <div>
      <h1 data-i18n="title">Base64 编码解码</h1>
      <p class="sub" data-i18n="sub"></p>
    </div>
    <div class="lang" id="lang" data-active="zh" role="group" aria-label="Language">
      <button type="button" data-lang="zh" aria-pressed="true">中文</button>
      <button type="button" data-lang="en" aria-pressed="false">EN</button>
    </div>
  </header>

  <section class="panel">
    <div class="field-head">
      <label for="input" data-i18n="input"></label>
      <span style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end">
        <span class="count" id="inCount"></span>
        <button class="copy" id="pasteIn" data-i18n="paste"></button>
        <button class="copy" id="copyIn" data-i18n="copy"></button>
      </span>
    </div>
    <textarea id="input" data-i18n-ph="phIn" spellcheck="false"></textarea>

    <div class="bar">
      <button class="primary" id="enc" data-i18n="enc"></button>
      <button class="primary" id="dec" data-i18n="dec"></button>
      <button id="swap" data-i18n="swap" data-i18n-title="swapTip"></button>
      <button class="ghost" id="clear" data-i18n="clear"></button>
      <span class="spacer"></span>
      <label class="opt"><input type="checkbox" id="urlsafe"><span class="switch"></span><span data-i18n="urlsafe"></span></label>
    </div>

    <div class="field-head">
      <span class="label" data-i18n="output"></span>
      <span style="display:flex;gap:12px;align-items:center">
        <span class="count" id="outCount"></span>
        <button class="copy" id="copy"></button>
      </span>
    </div>
    <textarea id="output" readonly data-i18n-ph="phOut" spellcheck="false" aria-labelledby="outLabel"></textarea>
    <p class="status" id="status" role="status" aria-live="polite"></p>
  </section>
  <footer>© 2026 Midas. All rights reserved.</footer>
</main>

<script>
(function(){
  var I18N={
    zh:{title:"Base64 编码解码",sub:"所有处理都在浏览器本地完成，内容不会上传。支持中文和 emoji。",
      input:"输入",output:"输出",enc:"编码",dec:"解码",swap:"交换",clear:"清空",copy:"复制",copied:"已复制",
      urlsafe:"URL 安全格式",swapTip:"把输出移到输入框",
      phIn:"在这里输入要编码的文本，或粘贴要解码的 Base64……",phOut:"结果会显示在这里",
      chars:"{n} 字符",
      sEnc:"已编码。",sDec:"已解码。",sSwap:"已把输出移到输入框。",sCopy:"已复制到剪贴板。",
      eEmpty:"请先输入内容。",eChars:"输入包含不属于 Base64 的字符。",eLen:"Base64 长度不正确，可能缺少了部分内容。",
      eUtf8:"解码成功，但结果不是有效的 UTF-8 文本（可能是二进制数据）。",
      eSwap:"输出为空，没有可交换的内容。",eCopyEmpty:"输出为空，没有可复制的内容。",eCopyFail:"复制失败，请手动选择输出内容。",eFail:"处理失败。",paste:"粘贴",sPaste:"已粘贴。",ePasteFail:"无法读取剪贴板，请在输入框中手动按 Ctrl/⌘ + V 粘贴。",eCopyEmptyIn:"输入为空，没有可复制的内容。"},
    en:{title:"Base64 Encoder & Decoder",sub:"Everything runs locally in your browser and nothing is uploaded. Chinese text and emoji are supported.",
      input:"Input",output:"Output",enc:"Encode",dec:"Decode",swap:"Swap",clear:"Clear",copy:"Copy",copied:"Copied",
      urlsafe:"URL-safe format",swapTip:"Move the output into the input box",
      phIn:"Type text to encode, or paste Base64 to decode…",phOut:"The result appears here",
      chars:"{n} chars",
      sEnc:"Encoded.",sDec:"Decoded.",sSwap:"Moved the output into the input box.",sCopy:"Copied to clipboard.",
      eEmpty:"Enter some text first.",eChars:"The input contains characters that are not valid Base64.",eLen:"The Base64 length is invalid; part of it may be missing.",
      eUtf8:"Decoded, but the result is not valid UTF-8 text (it may be binary data).",
      eSwap:"The output is empty, so there is nothing to swap.",eCopyEmpty:"The output is empty, so there is nothing to copy.",eCopyFail:"Copy failed. Please select the output manually.",eFail:"Something went wrong.",paste:"Paste",sPaste:"Pasted.",ePasteFail:"Clipboard access was blocked. Press Ctrl/⌘ + V in the input box instead.",eCopyEmptyIn:"The input is empty, so there is nothing to copy."}
  };

  var $=function(id){return document.getElementById(id)};
  var input=$("input"),output=$("output"),statusEl=$("status"),urlsafe=$("urlsafe"),copyBtn=$("copy");
  var reduce=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
  var lang="en",st={key:"",kind:""},copyTimer=null;

  try{lang=localStorage.getItem("b64-lang")||""}catch(e){}
  if(lang!=="zh"&&lang!=="en") lang=(navigator.language||"").toLowerCase().indexOf("zh")===0?"zh":"en";

  function t(k,n){var s=I18N[lang][k]||k;return n===undefined?s:s.replace("{n}",n)}
  function pulse(el,frames){ if(!reduce&&el.animate) el.animate(frames,{duration:340,easing:"cubic-bezier(.2,.7,.2,1)"}); }

  function renderStatus(animate){
    statusEl.textContent=st.key?t(st.key):"";
    statusEl.className="status"+(st.kind?" "+st.kind:"");
    if(animate&&st.key) pulse(statusEl,[{opacity:0,transform:"translateY(4px)"},{opacity:1,transform:"none"}]);
  }
  function setStatus(key,kind){st={key:key,kind:kind||""};renderStatus(true)}
  function counts(){
    $("inCount").textContent=t("chars",input.value.length);
    $("outCount").textContent=t("chars",output.value.length);
  }
  function showResult(v){
    output.value=v;
    pulse(output,[{opacity:.3,transform:"translateY(5px)",boxShadow:"0 0 0 4px rgba(212,175,55,.35)"},{opacity:1,transform:"none",boxShadow:"0 0 0 0 rgba(212,175,55,0)"}]);
  }

  function applyLang(){
    document.documentElement.lang=lang==="zh"?"zh-CN":"en";
    document.title=t("title");
    document.querySelectorAll("[data-i18n]").forEach(function(el){el.textContent=t(el.getAttribute("data-i18n"))});
    document.querySelectorAll("[data-i18n-ph]").forEach(function(el){el.placeholder=t(el.getAttribute("data-i18n-ph"))});
    document.querySelectorAll("[data-i18n-title]").forEach(function(el){el.title=t(el.getAttribute("data-i18n-title"))});
    copyBtn.textContent=copyBtn.classList.contains("done")?t("copied"):t("copy");
    $("lang").setAttribute("data-active",lang);
    document.querySelectorAll("#lang button").forEach(function(b){b.setAttribute("aria-pressed",String(b.getAttribute("data-lang")===lang))});
    counts();renderStatus(false);
  }
  document.querySelectorAll("#lang button").forEach(function(b){
    b.onclick=function(){
      lang=b.getAttribute("data-lang");
      try{localStorage.setItem("b64-lang",lang)}catch(e){}
      applyLang();
    };
  });

  function fail(code){var e=new Error(code);e.code=code;return e}
  function encode(text){
    var bytes=new TextEncoder().encode(text),bin="",chunk=0x8000;
    for(var i=0;i<bytes.length;i+=chunk) bin+=String.fromCharCode.apply(null,bytes.subarray(i,i+chunk));
    var b64=btoa(bin);
    if(urlsafe.checked) b64=b64.replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
    return b64;
  }
  function decode(text){
    var s=text.replace(/\s+/g,"").replace(/-/g,"+").replace(/_/g,"/");
    if(!/^[A-Za-z0-9+/]*={0,2}$/.test(s)) throw fail("eChars");
    if(s.length%4===1) throw fail("eLen");
    while(s.length%4) s+="=";
    var bin=atob(s),bytes=new Uint8Array(bin.length);
    for(var i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
    try{return new TextDecoder("utf-8",{fatal:true}).decode(bytes)}
    catch(e){throw fail("eUtf8")}
  }
  function run(fn,okKey){
    if(!input.value){output.value="";counts();setStatus("eEmpty","err");input.focus();return}
    try{showResult(fn(input.value));setStatus(okKey,"ok")}
    catch(e){output.value="";setStatus(e.code||"eFail","err")}
    counts();
  }

  $("enc").onclick=function(){run(encode,"sEnc")};
  $("dec").onclick=function(){run(decode,"sDec")};
  $("swap").onclick=function(){
    if(!output.value){setStatus("eSwap","err");return}
    input.value=output.value;output.value="";counts();setStatus("sSwap");
    pulse(input,[{opacity:.3,transform:"translateY(-5px)"},{opacity:1,transform:"none"}]);
  };
  $("clear").onclick=function(){input.value="";output.value="";counts();st={key:"",kind:""};renderStatus(false);input.focus()};
  copyBtn.onclick=function(){
    if(!output.value){setStatus("eCopyEmpty","err");return}
    var done=function(){
      setStatus("sCopy","ok");
      copyBtn.classList.add("done");copyBtn.textContent=t("copied");
      clearTimeout(copyTimer);
      copyTimer=setTimeout(function(){copyBtn.classList.remove("done");copyBtn.textContent=t("copy")},1500);
    };
    var fallback=function(){output.select();try{document.execCommand("copy");done()}catch(e){setStatus("eCopyFail","err")}};
    if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(output.value).then(done,fallback);
    else fallback();
  };
  function flashCopied(btn){
    btn.classList.add("done");btn.textContent=t("copied");
    setTimeout(function(){btn.classList.remove("done");btn.textContent=t("copy")},1500);
  }
  $("copyIn").onclick=function(){
    var b=this;
    if(!input.value){setStatus("eCopyEmptyIn","err");return}
    var done=function(){setStatus("sCopy","ok");flashCopied(b)};
    var fb=function(){input.select();try{document.execCommand("copy");done()}catch(e){setStatus("eCopyFail","err")}};
    if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(input.value).then(done,fb);
    else fb();
  };
  $("pasteIn").onclick=function(){
    var denied=function(){input.focus();setStatus("ePasteFail","err")};
    if(navigator.clipboard&&navigator.clipboard.readText){
      navigator.clipboard.readText().then(function(txt){
        input.value=txt;counts();setStatus("sPaste","ok");input.focus();
        pulse(input,[{opacity:.3,transform:"translateY(-5px)"},{opacity:1,transform:"none"}]);
      },denied);
    }else denied();
  };
  input.addEventListener("input",counts);
  input.addEventListener("keydown",function(e){
    if((e.ctrlKey||e.metaKey)&&e.key==="Enter"){e.preventDefault();$("enc").click()}
  });

  applyLang();
})();
</script>
</body>
</html>
