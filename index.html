<!DOCTYPE html>
<html>
<head>
    <title>Base64</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        /* 公共样式 */
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background-color: #fff;
            border: 1px solid #ccc;
            padding: 20px;
        }

        .input-container,
        .output-container {
            display: flex;
            flex-direction: column;
            margin-bottom: 20px;
        }

        .input-label,
        .output-label {
            font-weight: bold;
            margin-bottom: 5px;
        }

        .input-textarea,
        .output-textarea {
            height: 200px;
            padding: 10px;
            border: 1px solid #ccc;
            resize: vertical;
        }

        .button-container {
            display: flex;
            justify-content: center;
        }

        .button {
            padding: 10px 20px;
            background-color: #4CAF50;
            color: #fff;
            border: none;
            text-align: center;
            text-decoration: none;
            display: inline-block;
            font-size: 16px;
            margin: 10px;
            cursor: pointer;
            transition-duration: 0.4s;
            border-radius: 4px;
        }

        .button:hover {
            background-color: #45a049;
        }

        .clear-button {
            background-color: #f44336;
        }

        .clear-button:hover {
            background-color: #d32f2f;
        }

        .footer {
            text-align: center;
            margin-top: 20px;
        }

        /* 媒体查询 */
        @media (max-width: 600px) {
            .container {
                padding: 10px;
            }

            .input-textarea,
            .output-textarea {
                height: 150px;
            }
        }

        /* 标题居中 */
        .title-container {
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="title-container">
            <h1>Base64 编码解码</h1>
        </div>

        <div class="input-container">
            <label class="input-label" for="input-textarea">输入</label>
            <textarea id="input-textarea" class="input-textarea" placeholder="在此输入待编码或解码的文本"></textarea>
        </div>

        <div class="output-container">
            <label class="output-label" for="output-textarea">输出</label>
            <textarea id="output-textarea" class="output-textarea" readonly></textarea>
        </div>

        <div class="button-container">
            <button class="button" onclick="encode()">编码</button>
            <button class="button" onclick="decode()">解码</button>
            <button class="button clear-button" onclick="clearText()">清空</button>
        </div>
    </div>

    <script>
        function encode() {
            var inputTextarea = document.getElementById('input-textarea');
            var outputTextarea = document.getElementById('output-textarea');
            var inputText = inputTextarea.value.trim();
            var encodedText = btoa(encodeURIComponent(inputText).replace(/%([0-9A-F]{2})/g, function(match, p1) {
                return String.fromCharCode(parseInt(p1, 16));
            }));
            outputTextarea.value = encodedText;
        }

        function decode() {
            var inputTextarea = document.getElementById('input-textarea');
            var outputTextarea = document.getElementById('output-textarea');
            var inputText = inputTextarea.value.trim();
            try {
                var decodedText = decodeURIComponent(Array.prototype.map.call(atob(inputText), function(c) {
                    return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
                }).join(''));
                outputTextarea.value = decodedText;
            } catch (error) {
                outputTextarea.value = '解码错误：输入不是有效的 Base64 编码';
            }
        }

        function clearText() {
            var inputTextarea = document.getElementById('input-textarea');
            var outputTextarea = document.getElementById('output-textarea');
            inputTextarea.value = '';
            outputTextarea.value = '';
        }
    </script>

    <div class="footer">
        &copy; 2025 Midas. All rights reserved.
    </div>
</body>
</html>
