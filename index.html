<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Base64 编码解码</title>
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#07070a;--surface:#100f0c;--raised:#17150f;--ink:#f3ead6;--muted:#9a8f77;--line:#2a2519;
  --gold:#d4af37;--on-gold:#1a1405;--err:#ff8a7a;--ease:cubic-bezier(.2,.7,.2,1);
  --grad:linear-gradient(135deg,#f0d78a,#d4af37 50%,#a9821f);
  --sans:system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Songti SC","Source Han Serif SC","Noto Serif CJK SC",serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;min-height:100vh;color:var(--ink);font-family:var(--sans);
  background:radial-gradient(ellipse 70% 40% at 50% -8%,rgba(212,175,55,.18),transparent 70%),
             radial-gradient(ellipse 50% 30% at 100% 100%,rgba(169,130,31,.09),transparent 70%),var(--bg);
  display:flex;justify-content:center;padding:clamp(14px,5vw,56px) clamp(12px,4vw,24px);
}
main{width:100%;max-width:840px}
header{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:clamp(16px,3vw,26px)}
h1{margin:0 0 8px;font-family:var(--serif);font-size:clamp(28px,6vw,46px);font-weight:700;letter-spacing:.02em;line-height:1.15;
  background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{margin:0;color:var(--muted);font-size:clamp(13px,2.4vw,15px);max-width:48ch;line-height:1.6}

.lang{position:relative;display:inline-grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--surface)}
.lang::before{content:"";position:absolute;top:3px;bottom:3px;left:3px;width:calc(50% - 3px);border-radius:999px;background:var(--grad);transition:transform .35s var(--ease)}
.lang[data-active="en"]::before{transform:translateX(100%)}
.lang button{position:relative;z-index:1;border:0;background:none;padding:6px 16px;font-size:13px;font-weight:700;color:var(--muted);border-radius:999px;transition:color .25s}
.lang button[aria-pressed="true"]{color:var(--on-gold)}

.panel{
  position:relative;padding:clamp(14px,3.5vw,24px);border-radius:20px;border:1px solid transparent;
  background:linear-gradient(var(--surface),var(--surface)) padding-box,
             linear-gradient(145deg,rgba(240,215,138,.7),rgba(212,175,55,.12) 40%,rgba(169,130,31,.5)) border-box;
  box-shadow:0 30px 80px -30px #000;animation:rise .55s var(--ease) both;
}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.drop{position:absolute;inset:0;z-index:5;display:grid;place-items:center;border-radius:20px;background:rgba(7,7,10,.88);
  border:2px dashed var(--gold);color:var(--gold);font-weight:700;opacity:0;pointer-events:none;transition:opacity .2s}
.panel.drag .drop{opacity:1}

.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:10px;flex-wrap:wrap}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
label,.label{font-weight:700;font-size:15px}
.count{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}
.chip{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px;padding:6px 8px 6px 14px;border-radius:10px;
  background:var(--raised);border:1px solid rgba(212,175,55,.35);font-size:13px;word-break:break-all}
.chip button{padding:2px 9px;font-size:16px;line-height:1.2;border-radius:8px}
textarea{
  display:block;width:100%;min-height:clamp(120px,22vh,240px);resize:vertical;border-radius:14px;
  border:1.5px solid var(--line);background:#0b0a08;padding:14px 16px;color:var(--ink);outline:none;word-break:break-all;
  font:400 14px/1.6 var(--mono);transition:border-color .2s,box-shadow .25s;
}
#output{background:var(--raised)}
textarea:hover{border-color:rgba(212,175,55,.45)}
textarea:focus{border-color:var(--gold);box-shadow:0 0 0 4px rgba(212,175,55,.16)}
#prev{display:block;max-width:100%;max-height:200px;margin-top:10px;border-radius:12px;border:1px solid var(--line);object-fit:contain;background:#000}

.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:clamp(14px,2.5vw,18px) 0 12px}
.seg{position:relative;flex:1 1 260px;display:grid;grid-template-columns:repeat(3,1fr);padding:3px;border-radius:14px;background:var(--raised);border:1px solid var(--line)}
.seg::before{content:"";position:absolute;top:3px;bottom:3px;left:3px;width:calc((100% - 6px)/3);border-radius:11px;background:var(--grad);
  box-shadow:0 6px 20px -8px rgba(212,175,55,.7);transition:transform .35s var(--ease)}
.seg[data-mode="enc"]::before{transform:translateX(100%)}
.seg[data-mode="dec"]::before{transform:translateX(200%)}
.seg button{position:relative;z-index:1;border:0;background:none;padding:10px 8px;color:var(--muted);transition:color .25s}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{color:var(--on-gold)}
.acts{display:flex;gap:8px;flex-wrap:wrap}

button{font:inherit;font-weight:700;font-size:15px;cursor:pointer;border-radius:12px;padding:10px 18px;border:1.5px solid var(--line);
  background:var(--surface);color:var(--ink);transition:transform .15s var(--ease),border-color .2s,color .2s,background .2s}
button:hover{border-color:var(--gold)}
button:active{transform:scale(.97)}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.ghost{font-weight:500;color:var(--muted);border-color:transparent;background:none}
.ghost:hover{color:var(--ink);border-color:var(--line)}
.mini{padding:5px 13px;font-size:13px;border-radius:9px}
.mini.done{background:var(--gold);border-color:var(--gold);color:var(--on-gold)}

.opts{display:flex;flex-wrap:wrap;gap:8px 20px;margin-bottom:18px}
.opt{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:400;color:var(--muted);cursor:pointer;user-select:none}
.opt input{position:absolute;opacity:0;pointer-events:none}
.switch{width:36px;height:21px;border-radius:99px;background:var(--line);position:relative;flex:none;transition:background .25s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:15px;height:15px;border-radius:50%;background:var(--ink);transition:transform .3s var(--ease),background .25s}
.opt input:checked+.switch{background:var(--gold)}
.opt input:checked+.switch::after{transform:translateX(15px);background:var(--on-gold)}
.opt input:focus-visible+.switch{outline:3px solid var(--gold);outline-offset:2px}

.status{min-height:22px;margin:12px 2px 0;font-size:14px;color:var(--muted)}
.status.err{color:var(--err)}
.status.ok{color:#e6c569}
footer{margin-top:clamp(18px,4vw,32px);text-align:center;font-size:13px;color:var(--muted);animation:rise .55s var(--ease) .12s both}
footer::before{content:"";display:block;width:48px;height:1px;margin:0 auto 14px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}

@media (max-width:560px){
  .bar{display:grid;grid-template-columns:1fr}
  .acts{display:grid;grid-template-columns:repeat(3,1fr)}
  .acts button{padding:10px 6px}
}
@media (max-width:340px){.count{display:none}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main>
  <header>
    <div>
      <h1 data-i18n="title">Base64 编码解码</h1>
      <p class="sub" data-i18n="sub"></p>
    </div>
    <div class="lang" id="lang" data-active="zh" role="group" aria-label="Language">
      <button type="button" data-lang="zh" aria-pressed="true">中文</button>
      <button type="button" data-lang="en" aria-pressed="false">EN</button>
    </div>
  </header>

  <section class="panel" id="panel">
    <div class="drop" data-i18n="dropHint"></div>
    <div class="head">
      <label for="input" data-i18n="input"></label>
      <span class="tools">
        <span class="count" id="inCount"></span>
        <button class="mini" id="pasteIn" data-i18n="paste"></button>
        <button class="mini" id="copyIn" data-i18n="copy"></button>
      </span>
    </div>
    <div class="chip" id="chip" hidden><span id="chipText"></span><button class="ghost" id="chipX" aria-label="Remove">×</button></div>
    <textarea id="input" data-i18n-ph="phIn" spellcheck="false" autocomplete="off" autocapitalize="off"></textarea>

    <div class="bar">
      <div class="seg" id="seg" data-mode="auto" role="group">
        <button type="button" data-mode="auto" aria-pressed="true" data-i18n="auto"></button>
        <button type="button" data-mode="enc" aria-pressed="false" data-i18n="enc"></button>
        <button type="button" data-mode="dec" aria-pressed="false" data-i18n="dec"></button>
      </div>
      <div class="acts">
        <button id="swap" data-i18n="swap" data-i18n-title="swapTip"></button>
        <button id="pick" data-i18n="file" data-i18n-title="fileTip"></button>
        <button class="ghost" id="clear" data-i18n="clear"></button>
      </div>
    </div>
    <input type="file" id="fileIn" hidden>
    <div class="opts">
      <label class="opt"><input type="checkbox" id="urlsafe"><span class="switch"></span><span data-i18n="urlsafe"></span></label>
      <label class="opt"><input type="checkbox" id="wrap"><span class="switch"></span><span data-i18n="wrap"></span></label>
      <label class="opt"><input type="checkbox" id="datauri"><span class="switch"></span><span data-i18n="datauri"></span></label>
    </div>

    <div class="head">
      <span class="label" data-i18n="output"></span>
      <span class="tools">
        <span class="count" id="outCount"></span>
        <button class="mini" id="copy"></button>
      </span>
    </div>
    <textarea id="output" readonly data-i18n-ph="phOut" spellcheck="false" aria-label="Output"></textarea>
    <img id="prev" alt="" hidden>
    <p class="status" id="status" role="status" aria-live="polite"></p>
  </section>
  <footer>© 2026 Midas. All rights reserved.</footer>
</main>

<script>
(function(){
"use strict";
var I={
zh:{title:"Base64 编码解码",sub:"本地即时转换，内容不会上传。支持中文、emoji、文件和图片。",
 input:"输入",output:"输出",auto:"智能",enc:"编码",dec:"解码",swap:"交换",file:"文件",clear:"清空",paste:"粘贴",copy:"复制",copied:"已复制",
 urlsafe:"URL 安全",wrap:"76 列换行",datauri:"Data URI 前缀",swapTip:"把输出移到输入框，并反向转换",fileTip:"选择文件并转成 Base64",
 phIn:"输入文本或 Base64，边输入边转换。也可以把文件或图片拖进来。",phOut:"结果会显示在这里",dropHint:"松开以载入文件",
 stats:"{n} 字符",aEnc:"智能识别：已编码。",aDec:"智能识别：已解码。",sEnc:"已编码。",sDec:"已解码。",
 sSwap:"已交换并反向转换。",sCopy:"已复制到剪贴板。",sPaste:"已粘贴。",
 eEmpty:"请先输入内容。",eChars:"输入包含不属于 Base64 的字符。",eLen:"Base64 长度不正确，可能缺少了部分内容。",
 eSwap:"输出为空，没有可交换的内容。",eCopyEmpty:"输出为空，没有可复制的内容。",eCopyEmptyIn:"输入为空，没有可复制的内容。",
 eCopyFail:"复制失败，请手动选择内容。",ePasteFail:"无法读取剪贴板，请在输入框中手动按 Ctrl/⌘ + V。",eBig:"文件超过 20 MB，请换一个更小的文件。",eFail:"处理失败。",
 bin:"二进制数据，{size}，{type}。"},
en:{title:"Base64 Encoder & Decoder",sub:"Instant local conversion, nothing is uploaded. Supports Unicode text, emoji, files and images.",
 input:"Input",output:"Output",auto:"Smart",enc:"Encode",dec:"Decode",swap:"Swap",file:"File",clear:"Clear",paste:"Paste",copy:"Copy",copied:"Copied",
 urlsafe:"URL-safe",wrap:"Wrap at 76",datauri:"Data URI prefix",swapTip:"Move the output into the input and convert back",fileTip:"Pick a file and convert it to Base64",
 phIn:"Type text or Base64 and it converts as you type. You can also drop a file or image here.",phOut:"The result appears here",dropHint:"Drop to load the file",
 stats:"{n} chars",aEnc:"Smart detect: encoded.",aDec:"Smart detect: decoded.",sEnc:"Encoded.",sDec:"Decoded.",
 sSwap:"Swapped and converted back.",sCopy:"Copied to clipboard.",sPaste:"Pasted.",
 eEmpty:"Enter some text first.",eChars:"The input contains characters that are not valid Base64.",eLen:"The Base64 length is invalid; part of it may be missing.",
 eSwap:"The output is empty, so there is nothing to swap.",eCopyEmpty:"The output is empty, so there is nothing to copy.",eCopyEmptyIn:"The input is empty, so there is nothing to copy.",
 eCopyFail:"Copy failed. Please select the text manually.",ePasteFail:"Clipboard access was blocked. Press Ctrl/⌘ + V in the input box instead.",eBig:"The file is larger than 20 MB. Please pick a smaller one.",eFail:"Something went wrong.",
 bin:"Binary data, {size}, {type}."}
};
var $=function(id){return document.getElementById(id)};
var input=$("input"),output=$("output"),statusEl=$("status"),prev=$("prev"),chip=$("chip"),panel=$("panel"),
    urlsafe=$("urlsafe"),wrap=$("wrap"),datauri=$("datauri"),seg=$("seg");
var reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
var lang="",mode="auto",eff="enc",file=null,bin=null,blobUrl="",timer=0,st={key:"",kind:""};
try{lang=localStorage.getItem("b64-lang")||""}catch(e){}
if(lang!=="zh"&&lang!=="en")lang=/^zh/i.test(navigator.language||"")?"zh":"en";

function t(k,v){var s=I[lang][k]||k;return v?s.replace(/\{(\w+)\}/g,function(_,n){return v[n]}):s}
function fmt(n){return n<1024?n+" B":n<1048576?(n/1024).toFixed(1)+" KB":(n/1048576).toFixed(1)+" MB"}
function pulse(el,fr){if(!reduce&&el.animate)el.animate(fr,{duration:320,easing:"cubic-bezier(.2,.7,.2,1)"})}
function fail(c){var e=new Error(c);e.code=c;return e}

function renderStatus(){statusEl.textContent=st.key?t(st.key):"";statusEl.className="status"+(st.kind?" "+st.kind:"")}
function setStatus(key,kind){
  var changed=st.key!==key;st={key:key,kind:kind||""};renderStatus();
  if(changed&&key)pulse(statusEl,[{opacity:0,transform:"translateY(4px)"},{opacity:1,transform:"none"}]);
}
function binText(){
  var b=bin.bytes,hex=Array.prototype.map.call(b.subarray(0,128),function(x){return(x<16?"0":"")+x.toString(16)}).join(" ");
  return t("bin",{size:fmt(b.length),type:bin.mime||"application/octet-stream"})+"\n\n"+hex+(b.length>128?" …":"");
}
function counts(){
  $("inCount").textContent=file?fmt(file.bytes.length):t("stats",{n:input.value.length})+(input.value?" · "+fmt(new Blob([input.value]).size):"");
  $("outCount").textContent=bin?fmt(bin.bytes.length):t("stats",{n:output.value.length});
}
function releaseBin(){
  bin=null;prev.hidden=true;prev.removeAttribute("src");
  if(blobUrl){URL.revokeObjectURL(blobUrl);blobUrl=""}
}

function sniff(b){
  if(b[0]===0x89&&b[1]===0x50&&b[2]===0x4e&&b[3]===0x47)return"image/png";
  if(b[0]===0xff&&b[1]===0xd8&&b[2]===0xff)return"image/jpeg";
  if(b[0]===0x47&&b[1]===0x49&&b[2]===0x46)return"image/gif";
  if(b[0]===0x52&&b[1]===0x49&&b[2]===0x46&&b[3]===0x46&&b[8]===0x57&&b[9]===0x45)return"image/webp";
  if(b[0]===0x25&&b[1]===0x50&&b[2]===0x44&&b[3]===0x46)return"application/pdf";
  return"";
}
function encode(){
  var bytes=file?file.bytes:new TextEncoder().encode(input.value),raw="";
  for(var i=0;i<bytes.length;i+=32768)raw+=String.fromCharCode.apply(null,bytes.subarray(i,i+32768));
  var s=btoa(raw);
  if(urlsafe.checked)s=s.replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
  if(wrap.checked)s=s.replace(/(.{76})(?=.)/g,"$1\n");
  if(file&&datauri.checked)s="data:"+file.type+";base64,"+s;
  return s;
}
function decode(){
  var s=input.value.trim(),mime="",m=s.match(/^data:([^;,]*)[^,]*?;base64,/i);
  if(m){mime=m[1];s=s.slice(m[0].length)}
  s=s.replace(/\s+/g,"").replace(/-/g,"+").replace(/_/g,"/");
  if(!/^[A-Za-z0-9+/]*={0,2}$/.test(s))throw fail("eChars");
  if(s.length%4===1)throw fail("eLen");
  while(s.length%4)s+="=";
  var raw=atob(s),b=new Uint8Array(raw.length),text=null;
  for(var i=0;i<raw.length;i++)b[i]=raw.charCodeAt(i);
  try{text=new TextDecoder("utf-8",{fatal:true}).decode(b);if(/[\x00-\x08\x0e-\x1f]/.test(text))text=null}catch(e){}
  return{bytes:b,text:text,mime:sniff(b)||mime,uri:!!m};
}
function showDecoded(d){
  if(d.text!==null){output.value=d.text;return}
  bin={bytes:d.bytes,mime:d.mime};output.value=binText();
  if(/^image\/(png|jpeg|gif|webp)$/.test(d.mime)){
    blobUrl=URL.createObjectURL(new Blob([d.bytes],{type:d.mime}));prev.src=blobUrl;prev.hidden=false;
  }
}

function convert(manual){
  releaseBin();
  var had=!!output.value;
  if(!file&&!input.value){
    output.value="";st={key:"",kind:""};renderStatus();counts();
    if(manual)setStatus("eEmpty","err");
    return;
  }
  var m=file?"enc":mode,d=null,auto=m==="auto";
  if(auto){
    try{d=decode();if(d.text===null&&!/^image\//.test(d.mime)&&!d.uri)d=null}catch(e){d=null}
    m=d?"dec":"enc";
  }
  try{
    if(m==="enc")output.value=encode();else showDecoded(d||decode());
    eff=m;setStatus(m==="enc"?(auto?"aEnc":"sEnc"):(auto?"aDec":"sDec"),"ok");
    if(manual||!had)pulse(output,[{opacity:.3,transform:"translateY(5px)",boxShadow:"0 0 0 4px rgba(212,175,55,.35)"},{opacity:1,transform:"none",boxShadow:"0 0 0 0 rgba(212,175,55,0)"}]);
  }catch(e){output.value="";setStatus(e.code||"eFail","err")}
  counts();
}
function schedule(){
  clearTimeout(timer);var n=input.value.length;
  timer=setTimeout(function(){convert(false)},n>100000?300:n>10000?90:0);
}
function setMode(m){
  mode=m;seg.setAttribute("data-mode",m);
  seg.querySelectorAll("button").forEach(function(b){b.setAttribute("aria-pressed",String(b.getAttribute("data-mode")===m))});
  convert(true);
}
function clearFile(){file=null;chip.hidden=true}
function loadFile(f){
  if(!f)return;
  if(f.size>20*1048576){setStatus("eBig","err");return}
  f.arrayBuffer().then(function(buf){
    file={bytes:new Uint8Array(buf),name:f.name||"file",type:f.type||"application/octet-stream"};
    input.value="";$("chipText").textContent="📎 "+file.name+" · "+fmt(f.size);chip.hidden=false;convert(true);
  });
}

function applyLang(){
  document.documentElement.lang=lang==="zh"?"zh-CN":"en";document.title=t("title");
  document.querySelectorAll("[data-i18n]").forEach(function(el){el.textContent=t(el.getAttribute("data-i18n"))});
  document.querySelectorAll("[data-i18n-ph]").forEach(function(el){el.placeholder=t(el.getAttribute("data-i18n-ph"))});
  document.querySelectorAll("[data-i18n-title]").forEach(function(el){el.title=t(el.getAttribute("data-i18n-title"))});
  $("copy").textContent=t("copy");
  $("lang").setAttribute("data-active",lang);
  document.querySelectorAll("#lang button").forEach(function(b){b.setAttribute("aria-pressed",String(b.getAttribute("data-lang")===lang))});
  if(bin)output.value=binText();
  counts();renderStatus();
}
document.querySelectorAll("#lang button").forEach(function(b){
  b.onclick=function(){lang=b.getAttribute("data-lang");try{localStorage.setItem("b64-lang",lang)}catch(e){}applyLang()};
});

function flash(btn){
  btn.classList.add("done");btn.textContent=t("copied");
  setTimeout(function(){btn.classList.remove("done");btn.textContent=t("copy")},1500);
}
function copyFrom(el,btn,emptyKey){
  if(!el.value){setStatus(emptyKey,"err");return}
  var ok=function(){setStatus("sCopy","ok");flash(btn)};
  var fb=function(){el.select();try{document.execCommand("copy");ok()}catch(e){setStatus("eCopyFail","err")}};
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(el.value).then(ok,fb);else fb();
}
$("copy").onclick=function(){copyFrom(output,this,"eCopyEmpty")};
$("copyIn").onclick=function(){copyFrom(input,this,"eCopyEmptyIn")};
$("pasteIn").onclick=function(){
  var denied=function(){input.focus();setStatus("ePasteFail","err")};
  if(navigator.clipboard&&navigator.clipboard.readText){
    navigator.clipboard.readText().then(function(txt){
      clearFile();input.value=txt;input.focus();convert(true);setStatus("sPaste","ok");
    },denied);
  }else denied();
};
$("swap").onclick=function(){
  if(!output.value||bin){setStatus("eSwap","err");return}
  clearFile();input.value=output.value;
  setMode(eff==="enc"?"dec":"enc");setStatus("sSwap","ok");
};
$("clear").onclick=function(){clearFile();input.value="";convert(false);input.focus()};
$("pick").onclick=function(){$("fileIn").click()};
$("fileIn").onchange=function(){loadFile(this.files[0]);this.value=""};
$("chipX").onclick=function(){clearFile();convert(false)};
seg.querySelectorAll("button").forEach(function(b){b.onclick=function(){setMode(b.getAttribute("data-mode"))}});
[urlsafe,wrap,datauri].forEach(function(el){el.onchange=function(){convert(false)}});

input.addEventListener("input",function(){if(file)clearFile();schedule()},{passive:true});
input.addEventListener("paste",function(e){
  var f=e.clipboardData&&e.clipboardData.files&&e.clipboardData.files[0];
  if(f){e.preventDefault();loadFile(f)}
});
input.addEventListener("keydown",function(e){
  if((e.ctrlKey||e.metaKey)&&e.key==="Enter"){e.preventDefault();$("copy").click()}
});
function hasFiles(e){return e.dataTransfer&&Array.prototype.indexOf.call(e.dataTransfer.types||[],"Files")>-1}
panel.addEventListener("dragover",function(e){if(hasFiles(e)){e.preventDefault();panel.classList.add("drag")}});
panel.addEventListener("dragleave",function(e){if(!panel.contains(e.relatedTarget))panel.classList.remove("drag")});
panel.addEventListener("drop",function(e){
  if(!hasFiles(e))return;
  e.preventDefault();panel.classList.remove("drag");loadFile(e.dataTransfer.files[0]);
});

applyLang();
})();
</script>
</body>
